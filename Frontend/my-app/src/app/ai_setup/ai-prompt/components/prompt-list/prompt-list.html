<div class="pr-list">
  <div class="pr-list__header">
    <h2 class="pr-list__title">Prompts</h2>
    <button
      type="button"
      class="pr-list__add-btn"
      title="Add prompt"
      (click)="createPrompt.emit()"
    >
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Add
    </button>
  </div>

  <div class="pr-list__search">
    <svg class="pr-list__search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <input
      type="text"
      class="pr-list__search-input"
      placeholder="Search by name or extension…"
      (input)="onSearch($event)"
    />
  </div>

  @if (isCreating()) {
    <div class="pr-list__draft">
      <span class="pr-list__draft-dot" aria-hidden="true"></span>
      Creating new prompt…
    </div>
  }

  <ul class="pr-list__items" role="listbox" aria-label="Prompt list">
    @for (item of filteredPrompts; track item.id) {
      <li
        class="pr-list__item"
        [class.pr-list__item--active]="!isCreating() && selectedId() === item.id"
        role="option"
        [attr.aria-selected]="!isCreating() && selectedId() === item.id"
        (click)="selectPrompt.emit(item.id)"
      >
        <div class="pr-list__item-top">
          <span class="pr-list__name">{{ item.name }}</span>
          <span
            class="pr-list__badge"
            [class.pr-list__badge--on]="item.enabled"
          >{{ item.enabled ? 'On' : 'Off' }}</span>
        </div>
        <p class="pr-list__desc">{{ item.introduction || 'No introduction set' }}</p>
        <div class="pr-list__meta">
          <span class="pr-list__ext">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M5.5 2.5h5v11h-5v-11zM4 4.5H2.5v7H4M12 4.5h1.5v7H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Ext {{ item.extension }}
          </span>
          <span class="pr-list__type">System</span>
        </div>
      </li>
    } @empty {
      <li class="pr-list__empty">No prompts found.</li>
    }
  </ul>
</div>
