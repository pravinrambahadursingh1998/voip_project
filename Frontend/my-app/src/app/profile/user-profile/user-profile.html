<div class="user-profile">
  <div class="user-profile__header">
    <h1 class="user-profile__title">User Profile</h1>
  </div>

  <div class="user-profile__grid">
    <aside class="user-profile__summary card">
      <div class="user-profile__photo" aria-hidden="true">{{ userInitials() }}</div>
      <h2 class="user-profile__name">{{ displayName() }}</h2>
      <p class="user-profile__role">{{ roleLabel() }}</p>
    </aside>

    <section class="user-profile__panel card">
      <div class="user-profile__tabs" role="tablist">
        <button
          type="button"
          role="tab"
          class="user-profile__tab"
          [class.user-profile__tab--active]="activeTab() === 'settings'"
          [attr.aria-selected]="activeTab() === 'settings'"
          (click)="setTab('settings')"
        >
          Profile Setting
        </button>
        <button
          type="button"
          role="tab"
          class="user-profile__tab"
          [class.user-profile__tab--active]="activeTab() === 'password'"
          [attr.aria-selected]="activeTab() === 'password'"
          (click)="setTab('password')"
        >
          Change Password
        </button>
      </div>

      @if (activeTab() === 'settings') {
        <form class="user-profile__form" (ngSubmit)="onUpdateProfile()">
          <div class="user-profile__media">
            <div class="user-profile__media-item">
              <label class="user-profile__label" for="profileImage">
                Profile Image <span class="user-profile__required">*</span>
              </label>
              <div class="user-profile__file">
                <label class="user-profile__file-btn" for="profileImage">Choose File</label>
                <input
                  id="profileImage"
                  type="file"
                  accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                  class="user-profile__file-input"
                  (change)="onFileSelected($event)"
                />
                <span class="user-profile__file-name">{{ selectedFileName() }}</span>
              </div>
              <p class="user-profile__hint">JPG, JPEG or PNG · Max 500 MB</p>
            </div>

            <div class="user-profile__media-item">
              <span class="user-profile__label">Capture Image</span>
              <div class="user-profile__alert" role="status">
                Webcam unavailable. Use HTTPS or upload a file instead.
              </div>
            </div>
          </div>

          <p class="user-profile__note">Select either a file upload or image capture.</p>

          <div class="user-profile__fields">
            <div class="user-profile__field">
              <label class="user-profile__label" for="firstName">
                First Name <span class="user-profile__required">*</span>
              </label>
              <input
                id="firstName"
                type="text"
                class="user-profile__input"
                [(ngModel)]="firstName"
                name="firstName"
                required
              />
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="lastName">
                Last Name <span class="user-profile__required">*</span>
              </label>
              <input
                id="lastName"
                type="text"
                class="user-profile__input"
                [(ngModel)]="lastName"
                name="lastName"
                required
              />
            </div>

            <div class="user-profile__field user-profile__field--full">
              <label class="user-profile__label" for="address">
                Address <span class="user-profile__required">*</span>
              </label>
              <textarea
                id="address"
                class="user-profile__textarea"
                rows="2"
                [(ngModel)]="address"
                name="address"
                required
              ></textarea>
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="email">
                Email <span class="user-profile__required">*</span>
              </label>
              <input
                id="email"
                type="email"
                class="user-profile__input"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="mobile">
                Mobile <span class="user-profile__required">*</span>
              </label>
              <input
                id="mobile"
                type="text"
                class="user-profile__input"
                [(ngModel)]="mobile"
                name="mobile"
                required
              />
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="country">
                Country <span class="user-profile__required">*</span>
              </label>
              <select
                id="country"
                class="user-profile__select"
                [(ngModel)]="country"
                name="country"
                required
              >
                <option value="India">India</option>
                <option value="United States">United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
              </select>
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="state">State</label>
              <select id="state" class="user-profile__select" [(ngModel)]="state" name="state">
                <option value="">Select State</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Delhi">Delhi</option>
                <option value="Karnataka">Karnataka</option>
              </select>
            </div>

            <div class="user-profile__field">
              <label class="user-profile__label" for="city">City</label>
              <select id="city" class="user-profile__select" [(ngModel)]="city" name="city">
                <option value="">Select City</option>
                <option value="Ajmer">Ajmer</option>
                <option value="Jaipur">Jaipur</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Ahmedabad">Ahmedabad</option>
                <option value="Bengaluru">Bengaluru</option>
              </select>
            </div>
          </div>

          <div class="user-profile__actions">
            <button type="submit" class="user-profile__submit">Update</button>
          </div>
        </form>
      } @else {
        <form class="user-profile__form user-profile__form--password" (ngSubmit)="onChangePassword()">
          <div class="user-profile__fields user-profile__fields--password">
            <div class="user-profile__field user-profile__field--full">
              <label class="user-profile__label" for="currentPassword">
                Current Password <span class="user-profile__required">*</span>
              </label>
              <input
                id="currentPassword"
                type="password"
                class="user-profile__input"
                [(ngModel)]="currentPassword"
                name="currentPassword"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="user-profile__field user-profile__field--full">
              <label class="user-profile__label" for="newPassword">
                New Password <span class="user-profile__required">*</span>
              </label>
              <input
                id="newPassword"
                type="password"
                class="user-profile__input"
                [(ngModel)]="newPassword"
                name="newPassword"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="user-profile__field user-profile__field--full">
              <label class="user-profile__label" for="confirmPassword">
                Confirm Password <span class="user-profile__required">*</span>
              </label>
              <input
                id="confirmPassword"
                type="password"
                class="user-profile__input"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <div class="user-profile__actions">
            <button type="submit" class="user-profile__submit">Update Password</button>
          </div>
        </form>
      }
    </section>
  </div>
</div>
