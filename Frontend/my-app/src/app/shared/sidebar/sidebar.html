<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__top">
    <div class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">P</span>
      <span class="sidebar__title" *ngIf="!collapsed()">PBX Bridge</span>
    </div>

    <button type="button" class="sidebar__toggle"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'" (click)="onToggleSidebar()">
      <svg *ngIf="collapsed()" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      <svg *ngIf="!collapsed()" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <div class="sidebar__env" *ngIf="!collapsed(); else envCollapsed">
    <span class="sidebar__env-dot" aria-hidden="true"></span>
    <span>PRODUCTION</span>
  </div>
  <ng-template #envCollapsed>
    <div class="sidebar__env sidebar__env--collapsed" title="PRODUCTION">
      <span class="sidebar__env-dot" aria-hidden="true"></span>
    </div>
  </ng-template>

  <nav class="sidebar__nav" aria-label="Main navigation">
    <div class="sidebar__section">
      <div class="sidebar__section-label" *ngIf="!collapsed()">
        <span>Operations</span>
      </div>

      <ul class="sidebar__list">
        <!-- Dashboard -->
        <li class="sidebar__item">
          <div class="sidebar__row">
            <a class="sidebar__link" routerLink="/dashboard" routerLinkActive="sidebar__link--active"
              [routerLinkActiveOptions]="{ exact: false }" [attr.title]="collapsed() ? 'Dashboard' : null">
              <span class="sidebar__icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                </svg>
              </span>
              <span class="sidebar__label" *ngIf="!collapsed()">Dashboard</span>
            </a>
          </div>
        </li>

        <!-- Gateways -->
        <li class="sidebar__item">
          <div class="sidebar__row">
            <button type="button" class="sidebar__link" [attr.title]="collapsed() ? 'Gateways' : null"
              (click)="toggleGateways($event)">
              <span class="sidebar__icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                </svg>
              </span>
              <span class="sidebar__label" *ngIf="!collapsed()">Gateways</span>
            </button>

            <button *ngIf="!collapsed()" type="button" class="sidebar__chevron"
              [class.sidebar__chevron--open]="gatewaysExpanded()" [attr.aria-expanded]="gatewaysExpanded()"
              [attr.aria-label]="(gatewaysExpanded() ? 'Collapse ' : 'Expand ') + 'Gateways'"
              (click)="toggleGateways($event)">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <ul class="sidebar__children" *ngIf="!collapsed() && gatewaysExpanded()">
            <li>
              <a class="sidebar__child-link" routerLink="/gateways" routerLinkActive="sidebar__child-link--active"
                [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <rect x="3" y="3" width="10" height="10" rx="1.2" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </span>
                <span>Gateway List</span>
              </a>
            </li>
          </ul>
        </li>

        <!-- AI Setup -->
        <li class="sidebar__item">
          <div class="sidebar__row">
            <button type="button" class="sidebar__link" [attr.title]="collapsed() ? 'AI Setup' : null"
              (click)="toggleAiSetup($event)">
              <span class="sidebar__icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.4" />
                  <path d="M8 5.5v5M5.5 8h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                </svg>
              </span>
              <span class="sidebar__label" *ngIf="!collapsed()">AI Setup</span>
            </button>

            <button *ngIf="!collapsed()" type="button" class="sidebar__chevron"
              [class.sidebar__chevron--open]="aiSetupExpanded()" [attr.aria-expanded]="aiSetupExpanded()"
              [attr.aria-label]="(aiSetupExpanded() ? 'Collapse ' : 'Expand ') + 'AI Setup'"
              (click)="toggleAiSetup($event)">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <ul class="sidebar__children" *ngIf="!collapsed() && aiSetupExpanded()">

            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/ai-connection"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <rect x="3" y="3" width="10" height="10" rx="1.2" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </span>
                <span>AI Connection</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/integrations"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M4 8h8M8 4v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                    <rect x="2.5" y="2.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </span>
                <span>API Integrations</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/ai-function"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M4 4.5h8M4 8h8M4 11.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                  </svg>
                </span>
                <span>AI Functions</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/ai-prompt"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M3.5 4h9v8.5H3.5V4z" stroke="currentColor" stroke-width="1.3" />
                    <path d="M5.5 6.5h5M5.5 9h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                  </svg>
                </span>
                <span>AI Prompts</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/overview"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="9" y="2.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="2.5" y="9" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="9" y="9" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </span>
                <span>Extension Overview</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/ai-setup/api-test"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M3 5.5h10M5 3.5v2M11 3.5v2" stroke="currentColor" stroke-width="1.3"
                      stroke-linecap="round" />
                    <rect x="3" y="5.5" width="10" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3" />
                    <path d="M5.5 8.5h5M5.5 10.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                  </svg>
                </span>
                <span>API Tester</span>
              </a>
            </li>

          </ul>
        </li>

        <!-- Management -->
        <li class="sidebar__item">
          <div class="sidebar__row">
            <button type="button" class="sidebar__link" [attr.title]="collapsed() ? 'Management' : null"
              (click)="toggleManagement($event)">
              <span class="sidebar__icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <circle cx="6" cy="5.5" r="2" stroke="currentColor" stroke-width="1.4" />
                  <path d="M2.5 12.5c.4-1.8 1.9-3 3.5-3s3.1 1.2 3.5 3" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" />
                  <circle cx="11" cy="6" r="1.6" stroke="currentColor" stroke-width="1.3" />
                  <path d="M10 9.2c1.1.2 2 .9 2.4 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                </svg>
              </span>
              <span class="sidebar__label" *ngIf="!collapsed()">Management</span>
            </button>

            <button *ngIf="!collapsed()" type="button" class="sidebar__chevron"
              [class.sidebar__chevron--open]="managementExpanded()" [attr.aria-expanded]="managementExpanded()"
              [attr.aria-label]="(managementExpanded() ? 'Collapse ' : 'Expand ') + 'Management'"
              (click)="toggleManagement($event)">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <ul class="sidebar__children" *ngIf="!collapsed() && managementExpanded()">
            <li>
              <a class="sidebar__child-link" routerLink="/management/dashboard"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: true }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="9" y="2.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="2.5" y="9" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="9" y="9" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </span>
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a class="sidebar__child-link" routerLink="/management/users"
                routerLinkActive="sidebar__child-link--active" [routerLinkActiveOptions]="{ exact: false }">
                <span class="sidebar__icon sidebar__icon--sm" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M3 4.5h10M3 8h10M3 11.5h6" stroke="currentColor" stroke-width="1.3"
                      stroke-linecap="round" />
                  </svg>
                </span>
                <span>Users</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>
</aside>
